<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0f1412">
<title>Aura · Modello di menu digitale (esempio) | DS Service</title>
<meta name="description" content="Ristorante moderno: piatti illustrati e animati, categorie su card che si girano in 3D e scheda del piatto con allergeni. Modello di menu digitale con QR code: provalo dal telefono, 30 giorni gratis.">
<meta property="og:type" content="website">
<meta property="og:locale" content="it_IT">
<meta property="og:site_name" content="DS Service · Menu digitali">
<meta property="og:title" content="Aura · Modello di menu digitale (esempio) | DS Service">
<meta property="og:description" content="Ristorante moderno con piatti animati e categorie su card 3D. Provalo dal telefono, 30 giorni gratis.">
<meta property="og:url" content="https://dsfabio.com/mdc-014">
<meta property="og:image" content="https://dsfabio.com/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/fonts/fraunces-inter.css">
<style>
:root{--bg:#0f1412;--bg2:#161d1a;--ink:#f1ead8;--sub:#a9b3a8;--gold:#e2c48f;--cop:#c98a5a;--line:rgba(241,234,216,.14);
--pm-bg:#141b18;--pm-ink:#f1ead8;--pm-sub:#a9b3a8;--pm-accent:#e2c48f;--pm-accent-ink:#0f1412;--pm-head:Fraunces,Georgia,serif;--pm-line:rgba(241,234,216,.2);--pm-art:radial-gradient(60% 60% at 50% 45%,#2b3a33,#0f1412)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.5;overflow-x:clip}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:10px}
.demo{background:var(--gold);color:#0f1412;text-align:center;font-size:.74rem;font-weight:800;padding:7px 12px}
.serif{font-family:Fraunces,Georgia,serif}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}

/* HERO */
.hero{position:relative;overflow:hidden;padding:40px 0 30px;background:radial-gradient(60% 70% at 80% 30%,rgba(201,138,90,.18),transparent 70%),radial-gradient(50% 60% at 10% 90%,rgba(226,196,143,.1),transparent 70%)}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center}
.kick{font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:700}
.hero h1{font-size:clamp(3.6rem,13vw,7.4rem);line-height:.86;font-weight:400;letter-spacing:-.02em;margin:12px 0 14px}
.hero h1 i{font-style:italic;color:var(--gold)}
.hero p{color:var(--sub);max-width:420px}
.info{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.info span{font-size:.78rem;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--line)}
.info .open::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#7bd389;margin-right:7px;box-shadow:0 0 0 0 rgba(123,211,137,.7);animation:ping 2s infinite}
@keyframes ping{70%,100%{box-shadow:0 0 0 9px rgba(123,211,137,0)}}
.orbit{position:relative;width:min(380px,82vw);aspect-ratio:1;margin:0 auto}
.orbit .ring{position:absolute;inset:0;animation:spin 26s linear infinite}
.orbit .ring text{fill:var(--gold);font-size:11.5px;letter-spacing:6px;font-family:Inter,sans-serif;font-weight:600}
.orbit .dish{position:absolute;inset:16%;border-radius:50%;background:radial-gradient(circle at 50% 40%,#25302b,#121816 70%);box-shadow:0 40px 80px rgba(0,0,0,.6),inset 0 0 0 1px var(--line);display:grid;place-items:center;animation:float 6s ease-in-out infinite}
.orbit .dish .pa{width:92%}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-12px)}}
@media (max-width:760px){.hero-grid{grid-template-columns:1fr}.orbit{margin-top:6px}}

/* CATEGORIE: card che si girano */
.cats-wrap{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 78%,transparent);padding:16px 0 18px}
.cats{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 18px 8px;margin:0 -18px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.flip{flex:0 0 150px;height:110px;perspective:800px;scroll-snap-align:start}
.flip-in{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.4,.5,1)}
.flip[aria-pressed="true"] .flip-in{transform:rotateY(180deg)}
.flip:not([aria-pressed="true"]):hover .flip-in{transform:rotateY(18deg)}
.face{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:14px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;border:1px solid var(--line)}
.front{background:var(--bg2)}
.front small{font-size:.7rem;letter-spacing:.2em;color:var(--sub)}
.front b{font-family:Fraunces,serif;font-weight:500;font-size:1.25rem;line-height:1.1}
.back{transform:rotateY(180deg);background:linear-gradient(140deg,var(--gold),var(--cop));color:#0f1412;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:2px;padding:10px 14px}
.back .pa{width:46px;height:46px;flex:0 0 46px}
.back>span{min-width:0}
.back b{font-family:Fraunces,serif;font-size:1.1rem;line-height:1.05;display:block}
.back small{font-size:.72rem;font-weight:700}

/* PIATTI */
.cat-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:8px 0 18px}
.cat-title h2{font-family:Fraunces,serif;font-weight:400;font-size:clamp(2rem,6vw,3rem);line-height:1}
.cat-title p{color:var(--sub);font-size:.88rem;max-width:300px;text-align:right}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-bottom:40px}
@media (max-width:860px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.grid{grid-template-columns:1fr}.cat-title{flex-direction:column}.cat-title p{text-align:left}}
.card{position:relative;text-align:left;border-radius:24px;background:var(--bg2);border:1px solid var(--line);overflow:hidden;transition:transform .5s cubic-bezier(.2,.9,.2,1),border-color .4s;transform-style:preserve-3d;opacity:0;transform:translateY(30px)}
.card.in{opacity:1;transform:none;transition:opacity .6s,transform .7s cubic-bezier(.2,.9,.2,1),border-color .4s}
.card:hover{border-color:rgba(226,196,143,.5)}
.card .pic{position:relative;height:190px;display:grid;place-items:center;background:radial-gradient(55% 60% at 50% 55%,#26332d,transparent 72%)}
.card .pic .pa{height:86%;width:auto;max-width:86%;transition:transform .6s cubic-bezier(.2,.9,.2,1)}
.card:hover .pic .pa{transform:scale(1.08) rotate(-4deg)}
.card .body{position:relative;z-index:2;padding:4px 18px 18px}
.card h3{font-family:Fraunces,serif;font-weight:500;font-size:1.25rem;line-height:1.15}
.card p{color:var(--sub);font-size:.88rem;margin:6px 0 12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .row{display:flex;justify-content:space-between;align-items:center}
.card .al{display:flex;gap:3px;font-size:.9rem}
.card .price{font-family:Fraunces,serif;font-size:1.2rem;color:var(--gold)}
.card .tag{position:absolute;top:12px;left:12px;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:rgba(15,20,18,.75);border:1px solid var(--line);color:var(--gold)}
.card .plus{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#0f1412;font-weight:800;transition:transform .4s}
.card:hover .plus{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){.orbit .ring,.orbit .dish{animation:none}.card{opacity:1;transform:none}}

/* Piè di pagina (su dsmenu.it lo compone il server con i dati del locale) */
footer{text-align:center;padding:30px 18px 34px;font-size:.9rem;line-height:1.5}
footer strong{display:block;font-size:1.5rem;line-height:1.1;margin-bottom:6px}
footer .finfo{opacity:.85}
footer small{opacity:.7}
.soc{display:flex;justify-content:center;gap:12px;margin:18px 0 6px}
.soc a{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;text-decoration:none;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.soc a:hover{transform:translateY(-4px) scale(1.06)}
.soc a.fb{background:#1877F2}.soc a.wa{background:#25D366}.soc a.tt{background:#111}
.soc a.ig{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}
.soc svg{width:22px;height:22px}
.flinks{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;margin-top:10px;font-size:.85rem}
.flinks a,footer .fby a{color:inherit;text-decoration:underline;text-underline-offset:3px;opacity:.9}
footer{border-top:1px solid var(--line);color:var(--sub)}
footer strong{font-family:Fraunces,Georgia,serif;font-weight:500;color:var(--gold)}

/* dsmenu: riquadri con dati di esempio nascosti */
.dsm-fake{display:none!important}
</style>
</head>
<body>
<header class="hero">
<div class="wrap hero-grid">
<div>
<span class="kick" data-dsm-opt="KICKER">__DSM_KICKER__</span>
<h1 class="serif">__DSM_NAME_A__<i>__DSM_NAME_B__</i></h1>
<p data-dsm-opt="TAGLINE">__DSM_TAGLINE__</p>
</div>
<div class="orbit" aria-hidden="true">
<svg class="ring" viewBox="0 0 300 300"><defs><path id="circ" d="M150 150m-132 0a132 132 0 1 1 264 0a132 132 0 1 1-264 0"/></defs><text><textPath href="#circ" id="ring-t">__DSM_RING__</textPath></text></svg>
<div class="dish" id="hero-dish"></div>
</div>
</div>
</header>

<div class="cats-wrap"><div class="wrap"><nav class="cats" id="cats" aria-label="Categorie del menu"></nav></div></div>

<main class="wrap">
<div class="cat-title"><h2 id="cat-name"></h2><p id="cat-desc"></p></div>
<div class="grid" id="grid"></div>
</main>
<footer>
  <strong>Aura</strong>
  <div class="finfo">Via Tortona 12, Milano · Tel. 02 1234567</div><small>Dati di esempio</small>
</footer>

<script src="assets/piatti.js"></script>
<script>
(function () {
'use strict';
/*DSM:DATA*/
var $ = function (s) { return document.querySelector(s); };
var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
/* Piatto in testata: il primo primo piatto (pasta, risotto, pizza…), altrimenti il primo del menu */
var all = [];
M.forEach(function (c) { (c.items || []).forEach(function (it) { all.push([it, c]); }); });
var star = all.filter(function (x) { var k = x[0].art || Piatti.guess(x[0].n); return /pasta|risotto|pizza|tagliata|pesce|lasagna/.test(k || ''); })[0] || all[0];
if (star) $('#hero-dish').innerHTML = Piatti.art(star[0], star[1]);

var cats = $('#cats'), grid = $('#grid'), cur = -1;
cats.innerHTML = M.map(function (c, i) {
  return '<button class="flip" type="button" aria-pressed="false" data-i="' + i + '"><span class="flip-in">' +
    '<span class="face front"><small>0' + (i + 1) + '</small><b>' + c.n + '</b></span>' +
    '<span class="face back">' + Piatti.catArt(c) + '<span><b>' + c.n + '</b><small>' + c.items.length + (c.items.length === 1 ? ' piatto' : ' piatti') + '</small></span></span>' +
    '</span></button>';
}).join('');

function show(i) {
  if (i === cur) return; cur = i;
  var c = M[i];
  Array.prototype.forEach.call(cats.children, function (b, k) { b.setAttribute('aria-pressed', k === i ? 'true' : 'false'); });
  $('#cat-name').innerHTML = c.n; $('#cat-desc').innerHTML = c.s || c.d || '';
  var list = c.items.map(function (it) { it.cat = c.n; it.catObj = c; return it; });
  grid.innerHTML = list.map(function (it, k) {
    var tag = (it.tags && it.tags[0]) || Piatti.label(it);
    return '<button class="card" type="button" data-k="' + k + '" aria-label="' + it.n + ', ' + Piatti.price(it.p) + '">' +
      '<div class="pic">' + Piatti.art(it, c) + '</div>' +
      (tag ? '<span class="tag">' + tag + '</span>' : '') + '<span class="plus" aria-hidden="true">+</span>' +
      '<div class="body"><h3>' + it.n + '</h3>' + (it.d ? '<p>' + it.d + '</p>' : '') + '<div class="row"><span class="al">' + Piatti.alIcons(it.al) + '</span><span class="price">' + Piatti.price(it.p) + '</span></div></div></button>';
  }).join('');
  Array.prototype.forEach.call(grid.children, function (card, k) {
    card.addEventListener('click', function () { Piatti.modal(list, k, card); });
    setTimeout(function () { card.classList.add('in'); }, reduced ? 0 : 90 * k + 60);
  });
}
cats.addEventListener('click', function (e) { var b = e.target.closest('.flip'); if (b) { show(+b.getAttribute('data-i')); b.scrollIntoView({behavior: reduced ? 'auto' : 'smooth', inline: 'center', block: 'nearest'}); } });
show(0);
})();
</script>
</body>
</html>
