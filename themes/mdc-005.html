<style>
:root{--paper:#f7efe0;--paper2:#efe3cc;--ink:#3a2a1d;--sub:#7b6650;--wood:#5b3a24;--wood2:#3e2717;--red:#a8382a;--chalk:#2b302b;--line:#dccbb0;--soc-bg:#5b3a24}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:64px}
body{color:var(--ink);font-family:Lora,Georgia,serif;line-height:1.55;background-color:var(--paper);background-image:radial-gradient(rgba(91,58,36,.06) 1px,transparent 1px),radial-gradient(rgba(91,58,36,.04) 1px,transparent 1px);background-size:7px 7px,13px 13px;background-position:0 0,3px 5px}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px dashed var(--red);outline-offset:3px;border-radius:6px}
.hand{font-family:Caveat,cursive}
.demo{background:var(--wood2);color:#f3d9a6;text-align:center;font:700 .74rem/1.4 system-ui,sans-serif;padding:7px 12px}

/* Testata in legno */
.top{background:linear-gradient(180deg,var(--wood),var(--wood2));color:#f7ead2;text-align:center;padding:34px 20px 70px;position:relative;overflow:hidden}
.top::before{content:"";position:absolute;inset:0;opacity:.18;background:repeating-linear-gradient(90deg,transparent 0 38px,rgba(0,0,0,.35) 38px 40px),repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 2px,transparent 2px 9px)}
.top>*{position:relative}
.est{font:600 .75rem/1 system-ui,sans-serif;letter-spacing:.3em;text-transform:uppercase;opacity:.85}
.top h1{font-family:Caveat,cursive;font-weight:700;font-size:clamp(3.4rem,15vw,5.6rem);line-height:.9;margin:10px 0 6px}
.top p{font-style:italic;opacity:.9}
.vine{font-size:1.4rem;letter-spacing:.4em;margin-top:10px;opacity:.8}

/* Lavagna */
.board-wrap{max-width:900px;margin:-50px auto 0;padding:0 16px;position:relative;z-index:2}
.board{background:var(--chalk);color:#eef0ea;border-radius:10px;padding:22px 20px 20px;border:10px solid #8a5a35;box-shadow:0 18px 40px rgba(0,0,0,.3),inset 0 0 40px rgba(0,0,0,.45);background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:5px 5px}
.board h2{font-family:Caveat,cursive;font-size:2rem;line-height:1;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.board h2 small{font-size:1.25rem;color:#f5d67a}
.chalk{list-style:none;margin-top:12px;display:grid;gap:8px}
.chalk li{display:flex;justify-content:space-between;gap:14px;font-family:Caveat,cursive;font-size:1.45rem;line-height:1.15;border-bottom:1px dashed rgba(255,255,255,.18);padding-bottom:6px;opacity:0;transform:translateX(-10px);animation:write .6s ease forwards}
.chalk li span:last-child{color:#f5d67a;white-space:nowrap}
@keyframes write{to{opacity:1;transform:none}}
.fixed{margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;background:rgba(255,255,255,.06);border-radius:8px;padding:10px 12px;font-size:.92rem}
.fixed b{font-family:Caveat,cursive;font-size:1.6rem;color:#f5d67a;line-height:1}

/* Indice categorie */
.idx{position:sticky;top:0;z-index:20;background:rgba(247,239,224,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:2px dashed var(--line);margin-top:26px}
.idx-in{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:900px;margin:0 auto;padding:10px 16px}
.idx-in::-webkit-scrollbar{display:none}
.idx a{flex:0 0 auto;text-decoration:none;font-family:Caveat,cursive;font-size:1.35rem;line-height:1;padding:8px 14px;border-radius:30px;border:1.5px solid var(--line);background:#fffaf0;transition:all .25s}
.idx a.on{background:var(--red);border-color:var(--red);color:#fff;transform:rotate(-2deg)}

main{max-width:900px;margin:0 auto;padding:8px 16px 30px}
.sec{padding-top:30px}
.sec-h{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.sec-h h2{font-family:Caveat,cursive;font-size:2.4rem;line-height:1;color:var(--red)}
.sec-h::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 14px)}
.sec>p{font-style:italic;color:var(--sub);margin-bottom:8px}
.list{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.it{position:relative;padding:14px 0 14px;border-bottom:1px solid var(--line)}
.it h3{font-weight:600;font-size:1.08rem;padding-right:70px;line-height:1.3}
.it h3 .star{color:var(--red);font-size:.9rem}
.it p{color:var(--sub);font-size:.92rem;font-style:italic;margin-top:2px}
.price{position:absolute;right:0;top:10px;font-family:Caveat,cursive;font-size:1.55rem;font-weight:700;color:var(--wood);background:#fffaf0;border:1.5px solid var(--line);border-radius:50%;width:62px;height:62px;display:grid;place-items:center;transform:rotate(-6deg);line-height:1}
.it:nth-child(even) .price{transform:rotate(5deg)}
.als{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;padding-right:70px}
.al{width:24px;height:24px;border-radius:50%;background:#fffaf0;border:1px solid var(--line);display:inline-grid;place-items:center;font-size:.72rem}
.none{font-size:.75rem;color:var(--sub);font-style:italic}
.legend{margin-top:30px;background:#fffaf0;border:1.5px dashed var(--line);border-radius:12px;padding:18px}
.legend h2{font-family:Caveat,cursive;font-size:2rem;color:var(--red);margin-bottom:8px}
.legend ul{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;font-size:.88rem}
.legend li{display:flex;gap:8px;align-items:center}
.legend p{font-size:.82rem;color:var(--sub);margin-top:10px;font-style:italic}
footer{text-align:center;padding:30px 18px 34px;color:var(--sub);font-size:.92rem}
footer strong{font-family:Caveat,cursive;font-size:2.2rem;color:var(--wood);display:block;line-height:1}
.rv{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}
.rv.in{opacity:1;transform:none}
@media (max-width:700px){.list{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.chalk li,.rv{opacity:1;transform:none}html{scroll-behavior:auto}}
.soc{display:flex;justify-content:center;gap:12px;margin:18px 0 6px}
.soc a{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--soc-bg,#222);color:var(--soc-fg,#fff);transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s;text-decoration:none}
.soc a:hover{transform:translateY(-4px) scale(1.06);box-shadow:0 10px 22px rgba(0,0,0,.25)}
.soc a.fb{background:#1877F2;color:#fff}.soc a.wa{background:#25D366;color:#fff}
.soc a.ig{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%);color:#fff}
.soc svg{width:23px;height:23px}
.flinks{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;margin-top:10px;font-size:.85rem}
.flinks a{text-decoration:underline;text-underline-offset:3px;color:inherit;opacity:.85}

/* dsmenu: riquadri con dati di esempio nascosti */
.board-wrap{display:none!important}
</style>
</head>
<body>

<header class="top">
  <p class="est" data-dsm-opt="KICKER">__DSM_KICKER__</p>
  <h1>__DSM_NAME__</h1>

  <div class="vine" aria-hidden="true">🍷🍝🧄</div>
</header>

<section class="board-wrap" aria-labelledby="oggi-t">
  <div class="board">
    <h2 id="oggi-t">Oggi in lavagna <small id="giorno"></small></h2>
    <ul class="chalk" id="chalk"></ul>
    <div class="fixed"><span>🍽️ Menu del giorno · primo, secondo, contorno, acqua e caffè</span><b>15 €</b></div>
  </div>
</section>

<nav class="idx" aria-label="Sezioni del menu"><div class="idx-in" id="idx"></div></nav>
<main id="menu"></main>

<footer>
  <strong>Osteria del Borgo</strong>
  Vicolo del Pozzo 4 · Tel. 0123 456789<br><small>Dati di esempio</small>
  <div class="soc"><a class="fb" href="https://www.facebook.com/" target="_blank" rel="noopener" aria-label="Facebook"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9.1 23.7v-8H6.6V12h2.5v-1.6c0-4.1 1.8-6 5.9-6 .8 0 2.1.2 2.6.3v3.3l-1.4-.1c-1.9 0-2.6.7-2.6 2.6V12h3.9l-.7 3.7h-3.2V24C19.4 23.2 24 18.2 24 12 24 5.4 18.6 0 12 0S0 5.4 0 12c0 5.6 3.9 10.4 9.1 11.7Z"/></svg></a><a class="ig" href="https://www.instagram.com/" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="5.2"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.6" cy="6.4" r="1.2" fill="currentColor" stroke="none"/></svg></a><a class="wa" href="https://wa.me/390123456789" target="_blank" rel="noopener" aria-label="WhatsApp"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.04 2a9.9 9.9 0 0 0-8.5 15l-1.3 4.8 4.9-1.3A9.9 9.9 0 1 0 12.04 2Zm5.8 14.1c-.25.7-1.45 1.33-2 1.38-.53.05-1.03.24-3.47-.72-2.93-1.16-4.8-4.15-4.95-4.35-.14-.2-1.18-1.57-1.18-3 0-1.42.75-2.12 1.01-2.41.27-.29.58-.36.78-.36h.56c.18 0 .42-.07.66.5.25.58.83 2.01.9 2.16.08.14.12.31.03.5-.1.2-.14.31-.29.48l-.43.5c-.14.15-.3.31-.13.6.17.3.75 1.24 1.6 2 1.1.98 2.03 1.28 2.32 1.43.29.14.46.12.63-.08.17-.19.73-.85.92-1.14.2-.29.39-.24.65-.14.27.1 1.68.79 1.97.94.29.14.48.21.55.33.07.12.07.7-.18 1.38Z"/></svg></a></div><nav class="flinks" aria-label="Contatti"><a href="tel:+390123456789">📞 Chiama</a><a href="https://maps.google.com/?q=Vicolo+del+Pozzo+4" target="_blank" rel="noopener">📍 Dove siamo</a><a href="https://www.google.com/maps" target="_blank" rel="noopener">⭐ Lascia una recensione</a></nav>
</footer>

<script>
(function () {
'use strict';
/*DSM:DATA*/
var eur = function (v) { return (v % 1 ? v.toFixed(2).replace('.', ',') : v) + '€'; };
var $ = function (s) { return document.querySelector(s); };
var d = new Date().getDay();
$('#giorno').textContent = '· ' + GIORNI[d];
$('#chalk').innerHTML = LAVAGNA[d].map(function (x, i) { return '<li style="animation-delay:' + (300 + i * 450) + 'ms"><span>' + x[0] + '</span><span>' + eur(x[1]) + '</span></li>'; }).join('');
function als(a) { return a.length ? a.map(function (k) { return '<span class="al" title="' + AL[k][1] + '" aria-label="' + AL[k][1] + '">' + AL[k][0] + '</span>'; }).join('') : '<span class="none">Nessun allergene dichiarato</span>'; }
var html = '';
MENU.forEach(function (c) {
  html += '<section class="sec" id="' + c.id + '" aria-labelledby="h-' + c.id + '"><div class="sec-h"><h2 id="h-' + c.id + '">' + c.t + '</h2></div><p>' + c.s + '</p><div class="list">';
  c.items.forEach(function (it) {
    html += '<article class="it rv"><h3>' + it.n + (it.star ? ' <span class="star" title="Consigliato">★ consigliato</span>' : '') + '</h3><p>' + it.d + '</p><div class="als">' + als(it.a) + '</div><span class="price">' + eur(it.p) + '</span></article>';
  });
  html += '</div></section>';
});
html += '<section class="legend" aria-labelledby="leg"><h2 id="leg">Legenda allergeni</h2><ul>' + Object.keys(AL).map(function (k) { return '<li><span class="al">' + AL[k][0] + '</span>' + AL[k][1] + '</li>'; }).join('') + '</ul><p>Per informazioni su allergeni e intolleranze chiedi al personale. I piatti possono contenere tracce di altri allergeni.</p></section>';
$('#menu').innerHTML = html;
$('#idx').innerHTML = MENU.map(function (c) { return '<a href="#' + c.id + '">' + c.t + '</a>'; }).join('');
var links = document.querySelectorAll('.idx a');
function setOn(id) { links.forEach(function (l) { var on = l.getAttribute('href') === '#' + id; l.classList.toggle('on', on); if (on) l.parentNode.scrollTo({left: l.offsetLeft - 30, behavior: 'smooth'}); }); }
if ('IntersectionObserver' in window) {
  var so = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) setOn(e.target.id); }); }, {rootMargin: '-30% 0px -65% 0px'});
  document.querySelectorAll('.sec').forEach(function (s) { so.observe(s); });
  var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }); }, {threshold: .1});
  document.querySelectorAll('.rv').forEach(function (r) { io.observe(r); });
} else document.querySelectorAll('.rv').forEach(function (r) { r.classList.add('in'); });
setOn(MENU[0].id);
})();
</script>
